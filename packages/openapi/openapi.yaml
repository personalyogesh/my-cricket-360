openapi: 3.1.0
info:
  title: My Cricket 360 API
  version: 0.1.0
  description: >
    Organization-scoped cricket management API.
    The full generated contract lives in openapi.json (exported from FastAPI).
servers:
  - url: http://127.0.0.1:8400
    description: Local
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /v1/orgs:
    get:
      summary: List organizations
      responses:
        "200":
          description: OK
  /v1/me:
    get:
      summary: Current user profile and memberships
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
  /v1/orgs/{slug}/sponsors:
    get:
      summary: Public published sponsors for a club
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/orgs/{slug}/admin/sponsors:
    get:
      summary: Admin sponsor list (club admin only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
