services:
  db:
    image: postgres:16-alpine
    container_name: mc360-postgres
    environment:
      POSTGRES_USER: mc360
      POSTGRES_PASSWORD: mc360
      POSTGRES_DB: mc360
    ports:
      - "5433:5432"
    volumes:
      - mc360_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc360 -d mc360"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mc360_pg:
